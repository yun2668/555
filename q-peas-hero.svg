<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#DDF5F5"/>
    <stop offset="1" stop-color="#F8FCF7"/>
  </linearGradient>
  <linearGradient id="station" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#EAF4F1"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#174E55" flood-opacity=".16"/>
  </filter>
</defs>

<rect width="1200" height="900" rx="48" fill="url(#sky)"/>
<circle cx="1000" cy="135" r="78" fill="#FFE49A"/>

<!-- 雲朵 -->
<g fill="#fff" opacity=".96">
  <ellipse cx="155" cy="150" rx="80" ry="38"/>
  <ellipse cx="220" cy="154" rx="56" ry="33"/>
  <ellipse cx="195" cy="116" rx="48" ry="44"/>
  <ellipse cx="830" cy="118" rx="68" ry="33"/>
  <ellipse cx="885" cy="122" rx="48" ry="29"/>
  <ellipse cx="860" cy="90" rx="43" ry="38"/>
</g>

<!-- 遠方城市 -->
<g opacity=".74">
  <rect x="60" y="410" width="90" height="250" rx="8" fill="#B9DCE3"/>
  <rect x="163" y="355" width="104" height="305" rx="9" fill="#D2E8EC"/>
  <rect x="280" y="452" width="92" height="208" rx="8" fill="#B7D9E0"/>
  <rect x="844" y="380" width="94" height="280" rx="9" fill="#C6E3E7"/>
  <rect x="951" y="430" width="82" height="230" rx="8" fill="#B8D9E1"/>
  <rect x="1045" y="340" width="92" height="320" rx="9" fill="#D5EAED"/>
</g>

<!-- 草地 -->
<path d="M0 625C180 565 335 625 505 595C700 560 870 610 1200 535V900H0Z" fill="#BFE5B8"/>
<path d="M0 690C190 640 345 680 540 652C742 622 941 667 1200 610V900H0Z" fill="#A6D99E"/>

<!-- 監測站主體 -->
<g transform="translate(375 185)" filter="url(#shadow)">
  <rect x="0" y="150" width="430" height="400" rx="42" fill="url(#station)" stroke="#B8D9D4" stroke-width="5"/>
  <rect x="90" y="0" width="250" height="190" rx="30" fill="#173E4A"/>
  <rect x="112" y="25" width="206" height="135" rx="22" fill="#21343C"/>
  <!-- 表情 -->
  <circle cx="175" cy="87" r="13" fill="#fff"/>
  <circle cx="255" cy="87" r="13" fill="#fff"/>
  <circle cx="178" cy="90" r="5" fill="#173E4A"/>
  <circle cx="258" cy="90" r="5" fill="#173E4A"/>
  <path d="M190 120C212 141 240 141 262 120" stroke="#73D2C1" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="145" cy="119" rx="17" ry="10" fill="#F6B7AA" opacity=".8"/>
  <ellipse cx="284" cy="119" rx="17" ry="10" fill="#F6B7AA" opacity=".8"/>

  <!-- 頂部感測器 -->
  <rect x="197" y="-92" width="37" height="92" rx="15" fill="#54717A"/>
  <circle cx="215" cy="-108" r="31" fill="#fff" stroke="#678890" stroke-width="7"/>
  <path d="M200 -108H230M215 -123V-93" stroke="#168A79" stroke-width="6" stroke-linecap="round"/>

  <!-- 面板 -->
  <rect x="68" y="225" width="294" height="122" rx="24" fill="#E9F7F4"/>
  <text x="104" y="267" font-family="Arial" font-weight="800" font-size="30" fill="#168A79">AQI 62</text>
  <rect x="104" y="291" width="212" height="18" rx="9" fill="#D5E6E2"/>
  <rect x="104" y="291" width="103" height="18" rx="9" fill="#F0C94B"/>
  <circle cx="107" cy="390" r="24" fill="#56B879"/>
  <text x="96" y="398" font-family="Arial" font-weight="900" font-size="23" fill="#fff">✓</text>
  <text x="145" y="400" font-family="Microsoft JhengHei,Arial" font-weight="800" font-size="25" fill="#375A62">監測中</text>

  <!-- 腳架 -->
  <path d="M75 550L40 650M355 550L390 650" stroke="#668085" stroke-width="18" stroke-linecap="round"/>
  <path d="M20 652H410" stroke="#668085" stroke-width="20" stroke-linecap="round"/>
</g>

<!-- 漂浮數據泡泡 -->
<g filter="url(#shadow)">
  <g transform="translate(110 315)">
    <rect width="235" height="120" rx="30" fill="#fff"/>
    <circle cx="54" cy="54" r="27" fill="#E6F6F2"/>
    <text x="41" y="63" font-family="Arial" font-weight="900" font-size="22" fill="#168A79">PM</text>
    <text x="95" y="49" font-family="Arial" font-weight="900" font-size="26" fill="#173E4A">PM₂.₅</text>
    <text x="95" y="82" font-family="Arial" font-weight="800" font-size="30" fill="#2B708C">18</text>
  </g>
  <g transform="translate(850 255)">
    <rect width="235" height="120" rx="30" fill="#fff"/>
    <circle cx="54" cy="54" r="27" fill="#FFF2CF"/>
    <text x="42" y="64" font-family="Arial" font-weight="900" font-size="27" fill="#D79624">°C</text>
    <text x="95" y="49" font-family="Microsoft JhengHei,Arial" font-weight="900" font-size="24" fill="#173E4A">溫度</text>
    <text x="95" y="82" font-family="Arial" font-weight="800" font-size="30" fill="#2B708C">29.4</text>
  </g>
  <g transform="translate(848 430)">
    <rect width="235" height="120" rx="30" fill="#fff"/>
    <circle cx="54" cy="54" r="27" fill="#E8F3FF"/>
    <path d="M43 39C52 31 62 31 71 39M39 53C50 43 64 43 75 53M47 68C54 62 61 62 68 68" stroke="#3F8EC0" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="95" y="49" font-family="Microsoft JhengHei,Arial" font-weight="900" font-size="24" fill="#173E4A">風速</text>
    <text x="95" y="82" font-family="Arial" font-weight="800" font-size="30" fill="#2B708C">1.8</text>
  </g>
</g>

<!-- 小樹 -->
<g>
  <rect x="110" y="570" width="18" height="125" rx="9" fill="#78926B"/>
  <circle cx="118" cy="555" r="70" fill="#79C96A"/>
  <circle cx="72" cy="578" r="43" fill="#8ED37B"/>
  <rect x="1060" y="550" width="18" height="145" rx="9" fill="#78926B"/>
  <circle cx="1069" cy="525" r="78" fill="#79C96A"/>
  <circle cx="1113" cy="562" r="47" fill="#8ED37B"/>
</g>

<!-- 清新空氣符號 -->
<path d="M84 760C170 714 246 742 300 706" stroke="#5FC6B4" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="18 18"/>
<path d="M291 707L269 692M291 707L267 721" stroke="#5FC6B4" stroke-width="10" stroke-linecap="round"/>

<text x="74" y="85" fill="#157968" font-family="Microsoft JhengHei,Arial" font-size="36" font-weight="900">PEAS 環境觀測站｜Q版環境監測</text>
</svg>