<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#153F52"/>
    <stop offset="1" stop-color="#17665F"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#062734" flood-opacity=".25"/>
  </filter>
</defs>
<rect width="900" height="900" fill="url(#bg)"/>

<!-- 背景科技線 -->
<g opacity=".14" stroke="#A5E3DC" stroke-width="3">
  <path d="M50 150H245L320 225H520L590 160H850"/>
  <path d="M30 695H210L270 625H510L580 700H870"/>
  <circle cx="245" cy="150" r="8" fill="#A5E3DC"/>
  <circle cx="520" cy="225" r="8" fill="#A5E3DC"/>
  <circle cx="580" cy="700" r="8" fill="#A5E3DC"/>
</g>

<!-- 大型 Q版測站 -->
<g transform="translate(205 120)" filter="url(#shadow)">
  <rect x="75" y="135" width="340" height="470" rx="52" fill="#F6FBFA" stroke="#A9D7D1" stroke-width="6"/>
  <rect x="135" y="0" width="220" height="170" rx="34" fill="#1B3340"/>
  <rect x="156" y="23" width="178" height="120" rx="22" fill="#223943"/>
  <circle cx="205" cy="78" r="12" fill="#fff"/>
  <circle cx="283" cy="78" r="12" fill="#fff"/>
  <path d="M219 108C236 126 255 126 272 108" stroke="#74D5C4" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- 感測器 -->
  <rect x="226" y="-105" width="38" height="105" rx="15" fill="#769096"/>
  <circle cx="245" cy="-122" r="34" fill="#F6FBFA" stroke="#7A989D" stroke-width="7"/>
  <path d="M229 -122H261M245 -138V-106" stroke="#55C1AE" stroke-width="7" stroke-linecap="round"/>

  <!-- 資訊面板 -->
  <rect x="122" y="235" width="246" height="160" rx="28" fill="#E5F5F1"/>
  <text x="152" y="280" font-family="Arial" font-weight="900" font-size="32" fill="#158674">AQI 62</text>
  <text x="152" y="326" font-family="Arial" font-weight="800" font-size="24" fill="#315B67">PM2.5 18</text>
  <text x="152" y="365" font-family="Arial" font-weight="800" font-size="24" fill="#315B67">TEMP 29.4</text>

  <!-- 圖示按鈕 -->
  <circle cx="165" cy="455" r="33" fill="#F4C94D"/>
  <circle cx="245" cy="455" r="33" fill="#66BF80"/>
  <circle cx="325" cy="455" r="33" fill="#5AA9CF"/>
  <path d="M152 456H178" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <path d="M233 456L242 465L259 444" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M310 462C320 449 330 449 340 462" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- 腳 -->
  <path d="M135 605L100 720M355 605L390 720" stroke="#7D959A" stroke-width="20" stroke-linecap="round"/>
  <path d="M65 722H425" stroke="#7D959A" stroke-width="22" stroke-linecap="round"/>
</g>

<!-- 資料傳輸泡泡 -->
<g filter="url(#shadow)">
  <g transform="translate(35 270)">
    <rect width="180" height="132" rx="28" fill="#fff"/>
    <circle cx="50" cy="51" r="25" fill="#E5F5F1"/>
    <path d="M35 58C44 46 55 46 64 58M41 43C47 36 53 36 59 43" stroke="#178C79" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="88" y="48" font-family="Microsoft JhengHei,Arial" font-weight="900" font-size="22" fill="#173E4A">即時傳輸</text>
    <text x="34" y="98" font-family="Microsoft JhengHei,Arial" font-weight="700" font-size="18" fill="#59747B">感測資料上傳</text>
  </g>

  <g transform="translate(650 310)">
    <rect width="210" height="150" rx="28" fill="#fff"/>
    <circle cx="54" cy="55" r="27" fill="#E8F2FF"/>
    <path d="M40 65L50 49L61 59L72 38" stroke="#3D8FC0" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="51" font-family="Microsoft JhengHei,Arial" font-weight="900" font-size="22" fill="#173E4A">數據圖表</text>
    <text x="35" y="101" font-family="Microsoft JhengHei,Arial" font-weight="700" font-size="18" fill="#59747B">AQI・PM・氣象</text>
    <text x="35" y="128" font-family="Microsoft JhengHei,Arial" font-weight="700" font-size="18" fill="#59747B">變成易懂資訊</text>
  </g>

  <g transform="translate(65 585)">
    <rect width="210" height="150" rx="28" fill="#fff"/>
    <circle cx="54" cy="55" r="27" fill="#FFF4D5"/>
    <path d="M54 35L70 45V63C70 75 63 84 54 90C45 84 38 75 38 63V45Z" fill="#F0C654"/>
    <path d="M47 61L52 66L62 54" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="51" font-family="Microsoft JhengHei,Arial" font-weight="900" font-size="22" fill="#173E4A">持續維護</text>
    <text x="35" y="103" font-family="Microsoft JhengHei,Arial" font-weight="700" font-size="18" fill="#59747B">設備巡檢與校正</text>
  </g>
</g>

<!-- 資料流箭頭 -->
<g stroke="#8DE0D1" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="12 13">
  <path d="M212 355C255 325 278 317 310 312"/>
  <path d="M604 360C630 365 642 367 657 372"/>
  <path d="M273 655C306 630 330 620 350 610"/>
</g>

<text x="50" y="70" fill="#D9F8F1" font-family="Microsoft JhengHei,Arial" font-size="38" font-weight="900">PEAS 測站在做什麼？</text>
<text x="52" y="110" fill="#9EDBD2" font-family="Microsoft JhengHei,Arial" font-size="22" font-weight="700">持續觀測・資料傳輸・視覺化・設備維護</text>
</svg>